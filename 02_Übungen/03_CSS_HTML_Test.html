<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Übung 3</title>
    <style>
        * {
            margin: 0px;
        }

        .container1 {
            background-color: lightblue;
            width: 200px;
            height: 400px;
            position: relative;
            top: 40px;
            left: 40px;
        }

        .item1 {
            background-color: bisque;
            width: 40px;
            height: 40px;
            position: absolute;
            bottom: 0px;
            right: 0px;
        }

        .item2 {
            background-color: darkgrey;
            width: 40px;
            height: 40px;
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .container2 {
            background-color: darkblue;
            width: 80%;
            height: 100px;
            position: relative;
            top: 150px;
            left: 60px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }

        .item3 {
            background-color: aliceblue;
            width: 40px;
            height: 20px;
            margin: 60px;
        }
    </style>
</head>

<body>
    <div class="container1">
        <div class="item1">
        </div>
    </div>
    <div class="item2">
    </div>
    <div class="container2">
        <div class="item3">
        </div>
        <div class="item3">
        </div>
        <div class="item3">
        </div>
    </div>
</body>

</html>
