<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Übung 1</title>
    <style>
        * {
            margin: 0px;
        }

        .container1 {
            background-color: lightblue;
            height: 300px;
            width: 460px;
            position: relative;
            top: 20px;
            left: 20px;
        }

        .willkommen {
            padding: 20px;
        }

        .inbox {
            width: 100px;
            height: 100px;
            background-color: red;
            position: absolute;
            bottom: 0px;
            right: 0px;
        }

        .outbox {
            width: 50px;
            height: 50px;
            background-color: green;
            position: absolute;
            top: 0px;
            right: 0px;
        }

        .flexbox {
            background-color: lightgrey;
            width: 100%;
            height: 150px;
            position: relative;
            top: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .flex {
            background-color: blue;
            width: 100px;
            height: 100px;
            margin: 40px;
        }
    </style>
</head>

<body>
    <div class="container1">
        <div class="willkommen">
            <h1>Willkommen!</h1>
        </div>
        <div class="numbers">
            <ul>
                <li>eins</li>
                <li>zwei</li>
                <li>drei</li>
            </ul>
        </div>
        <div class="inbox">
        </div>
    </div>

    <div class="outbox">
    </div>

    <div class="flexbox">
        <div class="flex">
        </div>
        <div class="flex">
        </div>
        <div class="flex">
        </div>
        <div class="flex">
        </div>
    </div>
</body>

</html>
