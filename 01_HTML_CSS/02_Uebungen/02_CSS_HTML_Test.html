<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Übung 2</title>
    <style>
        * {
            margin: 0px;
        }

        .container1 {
            background-color: lightblue;
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: right;
        }

        .item {
            background-color: black;
            width: 30px;
            height: 30px;
            position: relative;
            top: 35px;
            right: 80px;
            margin: 8px;
        }

        .container2 {
            background-color: darkgrey;
            width: 400px;
            height: 300px;
            position: relative;
            top: 20px;
            left: 20px;
        }

        .item1 {
            background-color: darkgreen;
            width: 100px;
            height: 100px;
            position: absolute;
            bottom: 0px;
            right: 0px;
        }

        .container3 {
            background-color: darkblue;
            width: 50px;
            height: 50px;
            position: absolute;
            bottom: 0px;
            right: 0px;
        }
    </style>
</head>

<body>
    <div class="container1">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>

    <div class="container2">
        <div class="item1">
        </div>
    </div>
    <div class="container3">
    </div>
</body>

</html>
